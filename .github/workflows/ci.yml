name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel stale runs when a new commit is pushed to the same ref.
# This prevents a backlog of queued runs from burning Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Tighten token to read-only. CI only needs to check out code.
permissions:
  contents: read

jobs:
  # Where the static gate group runs: "true" = GitHub-hosted, else velo.
  # The repo is public, so hosted minutes are free: every event runs on
  # GitHub-hosted runners (ubuntu-24.04) unless repo variable CI_HOSTED=off,
  # the switch for when GitHub's runners are down. route itself, quality and
  # golden-lane follow the same variable. The output only picks between two
  # label sets written out in static's runs-on, so a wrong value cannot strand
  # the job on a label no runner has.
  route:
    name: CI route
    runs-on: ${{ vars.CI_HOSTED == 'off' && fromJSON('["self-hosted","linux","velo"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      hosted: ${{ steps.route.outputs.hosted }}
    steps:
      - name: Hosted or velo?
        id: route
        env:
          CI_HOSTED: ${{ vars.CI_HOSTED }}
        run: |
          if [ "$CI_HOSTED" = "off" ]; then
            echo "[route] velo: repo variable CI_HOSTED=off"
            echo "hosted=false" >> "$GITHUB_OUTPUT"
          else
            echo "[route] GitHub-hosted"
            echo "hosted=true" >> "$GITHUB_OUTPUT"
          fi

  # `bun run ci static`: every gate that needs nothing from velo (type checks,
  # lint, the text guards, unit and component tests, migration naming, the
  # production build). See the group list at the top of scripts/ci/run-ci.sh.
  # Measured on velo 2026-10-30 (load ~40): 13.5 min of gates + 7 min build.
  static:
    name: Static gates
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.hosted == 'true' && '"ubuntu-24.04"' || '["self-hosted","linux","velo"]') }}
    # Hosted: 40. Measured on ubuntu-24.04 (4 vCPU), PR #977 runs 41117290258
    # and 41124556128: 26 min including setup (re-measure and tighten). On velo,
    # the old bound for these steps: 58 min at load 150-250, plus install.
    # ubuntu-24.04, not ubuntu-latest: -latest moves to Ubuntu 26 from
    # 2026-10-19 (actions/runner-images#14748), and a moving image is a
    # moving gate.
    timeout-minutes: ${{ needs.route.outputs.hosted == 'true' && 40 || 75 }}
    # Read-only. actions + pull-requests: mq-merge-already-tested.ts reads the
    # merged PR and its CI run's jobs (CI_READ_TOKEN below).
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      # Full history: the merge check needs both parents' ancestry, and
      # raw-input-allowlist diffs against the base. persist-credentials: false
      # keeps this job's wider read token out of .git/config, where any test
      # could read it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # GitHub-hosted only: velo's runners already have bun and Node 20.
      # Same bun as velo (1.3.9); setup-bun is pinned to a commit because it
      # is the one third-party action in this workflow.
      - if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - if: ${{ runner.environment == 'github-hosted' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      # bun's download cache only, never node_modules: install below still
      # checks every package against bun.lock.
      - if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # What velo has and the static unit tests spawn: gs (the VLM PDF render).
      - if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ghostscript

      # --ignore-scripts: bun install otherwise runs lifecycle scripts of the
      # root, workspace members and trusted dependencies, any of which could
      # rewrite scripts/ci/run-ci.sh before the gate runs (R-052).
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Chromium for the unit tests that launch it, at the revision the locked
      # playwright expects. Velo's runners already have it.
      - if: ${{ runner.environment == 'github-hosted' }}
        run: bunx playwright install --with-deps chromium

      # The gate list lives in ONE place: scripts/ci/run-ci.sh (R-052); this
      # job runs its static group, `velo` below runs the rest, and
      # "Type Check, Lint & Test" passes only when both did. On a push to
      # master, run-ci.sh first asks scripts/ci/mq-merge-already-tested.ts
      # whether the pushed commit is a merge-queue merge whose exact tree
      # already passed both required checks as a pull_request run; if so it
      # exits 0 without running the gates. Any doubt or error runs them all.
      - name: CI gate (scripts/ci/run-ci.sh static)
        run: bun run ci static
        env:
          CI_READ_TOKEN: ${{ github.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: test-secret-for-ci-only
          NODE_ENV: test
          # Velo and production run in SAST; the date tests assert the local
          # day, and a hosted runner is UTC.
          TZ: Africa/Johannesburg

  # `bun run ci velo`: browser-tests (real Chromium and pinned text metrics)
  # and the integration suites, which start their own throwaway PostgreSQL 16
  # clusters as the runner user (scripts/ci/integration/run.sh) and ignore
  # DATABASE_URL. Hosted like static (route decides); the apt step installs
  # what velo has: PostgreSQL 16 + pgvector and LibreOffice (nginx is on the
  # image). The step prints every suite that skipped and why
  # (scripts/ci/report-skipped-integration.ts), and skips the suites on a
  # Markdown-only change (scripts/ci/integration/scope.ts).
  velo:
    name: Browser & integration
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.hosted == 'true' && '"ubuntu-24.04"' || '["self-hosted","linux","velo"]') }}
    # Hosted (PR #977, 3 runs): setup ~4 min, browser-tests 2-3 min,
    # integration 18-24 min, ~35 min in all. On velo 2026-10-30: browser-tests
    # 2m15s, integration 18 min at load ~40.
    # Integration's own bounds: 4 schema-build commands at 300 s + 30 s kill
    # grace (CI_INT_MIGRATE_TIMEOUT), shards cut at 30 min
    # (CI_INT_SHARD_TIMEOUT). Not bounded by those: postgres start retries
    # (up to 5 x 120 s per cluster), the 10 s TERM-to-KILL graces, initdb and
    # plan. 22 + 30 + ~10 + browser-tests ~10 under load + install = ~75, so 90.
    timeout-minutes: 90
    # As in static (the merge check).
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      # Full history: the integration scope diffs the tested tree against the
      # event's base, and the merge check needs both parents' ancestry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # As in static.
      - if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - if: ${{ runner.environment == 'github-hosted' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # What velo has and this group spawns: PostgreSQL 16 + pgvector for the
      # integration clusters (en_US.UTF-8), LibreOffice (soffice), poppler
      # (pdftotext/pdffonts/pdfinfo, the print tests).
      - if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-16 postgresql-16-pgvector libreoffice-calc-nogui poppler-utils
          sudo locale-gen en_US.UTF-8

      # As in static.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # As in static: Chromium for browser-tests.
      - if: ${{ runner.environment == 'github-hosted' }}
        run: bunx playwright install --with-deps chromium

      - name: CI gate (scripts/ci/run-ci.sh velo)
        run: bun run ci velo
        env:
          CI_READ_TOKEN: ${{ github.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: test-secret-for-ci-only
          NODE_ENV: test
          # As in static.
          TZ: Africa/Johannesburg

  # The required check. Branch protection and the merge queue
  # (requiredChecks in ~/.config/merge-queue/isaflow.json) wait for this name,
  # and mq-merge-already-tested.ts looks it up in the PR run. It passes only
  # when route, static and velo all succeeded. There is no velo fallback for a
  # hosted job GitHub refuses to start: a job pinned to velo would queue
  # forever once velo's runners are paused, and this check would never report;
  # CI_HOSTED=off is the switch. always() makes it run (and fail) when one
  # failed, was cancelled or timed out, or was skipped, because a required
  # check that is itself skipped counts as passing.
  quality:
    name: Type Check, Lint & Test
    needs: [route, static, velo]
    if: ${{ always() }}
    runs-on: ${{ vars.CI_HOSTED == 'off' && fromJSON('["self-hosted","linux","velo"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Both gate groups passed?
        env:
          ROUTE: ${{ needs.route.result }}
          STATIC: ${{ needs.static.result }}
          VELO: ${{ needs.velo.result }}
        run: |
          echo "route=$ROUTE static=$STATIC velo=$VELO"
          [ "$ROUTE" = "success" ] && [ "$STATIC" = "success" ] && [ "$VELO" = "success" ]

  # Which golden-paths concurrency group this run takes (see golden-paths).
  # "queue" for a run the merge queue is waiting on: a batch PR
  # (merge-queue/* head) or a PR labelled in-merge-queue. In single mode the
  # queue updates the branch server-side and labels the PR a few seconds
  # later, so the label is not in the event payload; read it from the API,
  # and when the head was committed by GitHub (web-flow, as update-branch is)
  # give the label up to a minute to arrive. Any error means "pr", the old
  # behaviour. Not a required check.
  golden-lane:
    name: Golden Paths lane
    runs-on: ${{ vars.CI_HOSTED == 'off' && fromJSON('["self-hosted","linux","velo"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - name: Decide the lane
        id: lane
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          lane="pr"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # A fork can name its branch merge-queue/*; only this repo's own
            # branches (the queue's batch branches) take the queue lane by name.
            if [ "$HEAD_REPO" = "$REPO" ]; then
              case "$HEAD_REF" in merge-queue/*) lane="queue" ;; esac
            fi
            if [ "$lane" = "pr" ]; then
              tries=1
              committer=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.committer.login // ""') || committer=""
              [ "$committer" = "web-flow" ] && tries=12
              for i in $(seq 1 "$tries"); do
                if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx in-merge-queue; then lane="queue"; break; fi
                if [ "$i" -lt "$tries" ]; then sleep 5; fi
              done
            fi
          fi
          echo "lane=$lane" | tee -a "$GITHUB_OUTPUT"

  # Golden-paths money-flow E2E (A–Z programme). BLOCKING since Phase 3
  # (P3.1): a red money path fails the whole run — no continue-on-error, no
  # silent skip. Boots a dev server and runs tests/e2e/golden-paths/ over HTTP.
  # On velo (CI_HOSTED=off) it runs against the shared isaflow_dev Demo company
  # with the runner-local env file. Otherwise it runs on a GitHub-hosted runner
  # (like golden-lane, it follows the variable itself), against a database of
  # its own: scripts/ci/golden-hosted/up.sh builds a throwaway PostgreSQL, a
  # GoTrue and a Demo company, and seed-demo-app.ts fills it. No real secret and
  # no velo database is involved.
  golden-paths:
    name: Golden Paths E2E (blocking)
    runs-on: ${{ vars.CI_HOSTED == 'off' && fromJSON('["self-hosted","linux","velo"]') || 'ubuntu-24.04' }}
    # Green runs took 19-30 min of test time on 2026-10-29, and #952's green run
    # took 49 min wall-clock at load ~60 (00:23-01:12Z); 30 cancelled every
    # queue run (#938, #940, #917) and 45 would still have cut that one.
    # 60 is ~2x the test time. Re-measure when specs are added: sum the
    # per-test times in a green run's log; keep this at >= 2x. Cost: a hung
    # run holds its golden-paths group up to 60 min.
    timeout-minutes: 60
    # Velo (CI_HOSTED=off): each runner owns one Golden Paths slot, a company of
    # its own on isaflow_dev with its own golden user (the step below maps
    # $RUNNER_NAME to GOLDEN_SLOT_n in /home/hein/isaflow-ci.env;
    # scripts/ci/golden/provision-slots.ts creates them). A runner runs one job
    # at a time, so a slot is exclusive without any lock, and runs of different
    # refs overlap on different runners. Before the slots every run wrote to the
    # ONE Demo company, which is why this was a single group for all refs.
    # The velo group is per ref and never cancels. It is NOT what keeps slots
    # apart (runner exclusivity does that): it only stops two golden runs of
    # one ref from running at once. GitHub keeps one running and one PENDING
    # job per group and cancels an older pending one, so a PR push used to
    # cancel the merge queue's pending run, and the queue ejected the PR (#938,
    # 2026-10-29). Runs the queue waits on (golden-lane) therefore take their
    # own -queue group, which an ordinary run cannot cancel. A master push that
    # skips (the step below) still enters its ref's group, but holds it for
    # seconds. !cancelled(): a failed golden-lane still runs the suite, in the
    # ordinary group.
    # Hosted, every run has its own database and nothing is shared, so the
    # group is the run's own id and runs never wait for each other, and no
    # slot is used (the suite logs in as the generated E2E admin).
    needs: golden-lane
    if: ${{ !cancelled() }}
    concurrency:
      group: ${{ vars.CI_HOSTED == 'off' && format('golden-paths-{0}{1}', github.ref, needs.golden-lane.outputs.lane == 'queue' && '-queue' || '') || format('golden-paths-hosted-{0}', github.run_id) }}
      cancel-in-progress: false
    # Read-only; for the merge check below (as in quality).
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      # As in quality: full history, no token left in .git/config (the install
      # below runs dependency lifecycle scripts).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Hosted golden-paths setup (velo has bun and Node 20), as in static;
      # before the merge check below, which runs a bun script.
      - if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - if: ${{ runner.environment == 'github-hosted' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.9
      - if: ${{ runner.environment == 'github-hosted' }}
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # A push to master that is an already-tested merge-queue merge skips the
      # suite (see quality's gate step); the job still reports success. Exit
      # 10 skips; any other exit, a crash included, runs the suite.
      - name: Already tested as a pull_request run?
        id: mq
        env:
          CI_READ_TOKEN: ${{ github.token }}
        run: |
          rc=0
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            bun scripts/ci/mq-merge-already-tested.ts || rc=$?
          fi
          if [ "$rc" -eq 10 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      # Hosted only: PostgreSQL 16 + pgvector for the throwaway cluster (as in
      # velo; docker, jq and psql tooling are on the image).
      - if: ${{ runner.environment == 'github-hosted' && steps.mq.outputs.skip != 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-16 postgresql-16-pgvector
          sudo locale-gen en_US.UTF-8

      - name: Install dependencies
        if: steps.mq.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      # Hosted only: Chromium and the system libraries it needs (velo has them).
      - if: ${{ runner.environment == 'github-hosted' && steps.mq.outputs.skip != 'true' }}
        run: bunx playwright install --with-deps chromium

      # Hosted only: the database, GoTrue and Demo company this run owns, and
      # the generated .env.local. Fails the job if any of it cannot be built.
      - name: Stand up Postgres, GoTrue and the Demo company
        if: ${{ runner.environment == 'github-hosted' && steps.mq.outputs.skip != 'true' }}
        env:
          ADMIN_ENV_FILE: ${{ runner.temp }}/golden-admin.env
          TZ: Africa/Johannesburg
        run: bash scripts/ci/golden-hosted/up.sh

      - name: Boot dev server and run golden paths
        if: steps.mq.outputs.skip != 'true'
        env:
          # Velo only: the real secrets never reach a hosted runner, whose
          # E2E admin is generated (ADMIN_ENV_FILE, below).
          E2E_ADMIN_EMAIL: ${{ vars.CI_HOSTED == 'off' && secrets.E2E_ADMIN_EMAIL || '' }}
          E2E_ADMIN_PASSWORD: ${{ vars.CI_HOSTED == 'off' && secrets.E2E_ADMIN_PASSWORD || '' }}
          ADMIN_ENV_FILE: ${{ runner.temp }}/golden-admin.env
        run: |
          set -e
          HOSTED=false
          [ "$RUNNER_ENVIRONMENT" = "github-hosted" ] && HOSTED=true
          if [ "$HOSTED" = true ]; then
            # .env.local and the admin login were generated by the step above.
            set -a; . "$ADMIN_ENV_FILE"; set +a
            # Velo and production run in SAST (as in static); a hosted runner is UTC.
            export TZ=Africa/Johannesburg
          else
            # A missing env file must FAIL, not skip: a blocking gate that
            # silently no-ops is exactly the "quiet 45/100" this job prevents.
            if [ ! -f /home/hein/isaflow-ci.env ]; then
              echo "::error::/home/hein/isaflow-ci.env missing on runner — golden paths cannot run (blocking gate, refusing to pass silently)"
              exit 1
            fi
            # One golden slot per runner. An unknown runner must FAIL: falling
            # back to the shared Demo company would let two runs interleave
            # money flows there again.
            case "$RUNNER_NAME" in
              velo-server-u) slot=1 ;;
              velo-isaflow-u2) slot=2 ;;
              velo-isaflow-u3) slot=3 ;;
              *)
                echo "::error::runner '$RUNNER_NAME' has no golden slot; add it to the case in the golden-paths job and provision a slot (scripts/ci/golden/provision-slots.ts)"
                exit 1
                ;;
            esac
            # Read the slot's keys with grep, not `source`: the file has values
            # that are not valid shell (SMTP_FROM).
            slot_value() { grep -m1 "^GOLDEN_SLOT_${slot}_$1=" /home/hein/isaflow-ci.env | cut -d= -f2-; }
            GOLDEN_COMPANY_ID=$(slot_value COMPANY_ID)
            GOLDEN_USER_EMAIL=$(slot_value EMAIL)
            GOLDEN_USER_PASSWORD=$(slot_value PASSWORD)
            if [ -z "$GOLDEN_COMPANY_ID" ] || [ -z "$GOLDEN_USER_EMAIL" ] || [ -z "$GOLDEN_USER_PASSWORD" ]; then
              echo "::error::GOLDEN_SLOT_${slot}_{COMPANY_ID,EMAIL,PASSWORD} missing from /home/hein/isaflow-ci.env; run scripts/ci/golden/provision-slots.ts"
              exit 1
            fi
            GOLDEN_SLOT_NUMBER=$slot
            # GitHub redacts only registered secrets; this one is runner-local.
            echo "::add-mask::$GOLDEN_USER_PASSWORD"
            echo "GOLDEN SLOT $slot (company $GOLDEN_COMPANY_ID, user $GOLDEN_USER_EMAIL) on runner $RUNNER_NAME"
            # The app and the dev server get the shared env file WITHOUT the slots'
            # keys: only the Playwright command below sees one slot's password.
            grep -v '^GOLDEN_SLOT_' /home/hein/isaflow-ci.env > .env.local
          fi
          bunx playwright install chromium
          if [ "$HOSTED" = true ]; then
            # A hosted VM runs only this job: any free port in the window.
            GOLDEN_PORT=$(bun scripts/ci/golden-free-port.ts 3300 3799)
          else
            # Each slot has a disjoint port window, so runners cannot race for
            # the same port after the free-port probe releases it. Stop only a
            # server this runner's workspace left in its own window, then choose
            # an actually bindable port there (also skipping Next.js bad ports).
            slot_lo=$((3300 + (slot - 1) * 166))
            slot_hi=$((slot_lo + 165))
            bun scripts/ci/golden/killSlotOrphans.ts "$slot_lo" "$slot_hi" || true
            GOLDEN_PORT=$(bun scripts/ci/golden-free-port.ts "$slot_lo" "$slot_hi")
          fi
          [ -n "$GOLDEN_PORT" ] || { echo "::error::golden-free-port printed no port"; exit 1; }
          # Hosted: the app's own URL is this server (velo's file names one).
          if [ "$HOSTED" = true ]; then export NEXT_PUBLIC_APP_URL="http://localhost:$GOLDEN_PORT"; fi
          # setsid: its own process group, so the trap stops next's children
          # too, not only the bunx wrapper.
          setsid bunx next dev -p "$GOLDEN_PORT" > golden-dev.log 2>&1 &
          DEVPID=$!
          trap 'kill -- -$DEVPID 2>/dev/null || true' EXIT
          # Ready only when OUR server says so: next dev logs "Ready in" once
          # it has bound the port (it exits on EADDRINUSE with -p, never
          # logging it), so another server answering the port is not enough.
          # grep -q only: the log is never printed (see below).
          for i in $(seq 1 90); do
            kill -0 "$DEVPID" 2>/dev/null || { echo "dev server exited during boot (port $GOLDEN_PORT) — see golden-dev.log in the runner workdir"; exit 1; }
            grep -q 'Ready in' golden-dev.log && curl -sf "http://localhost:$GOLDEN_PORT/api/health" >/dev/null && break
            sleep 2
          done
          # Do NOT cat/tail golden-dev.log here: the boot log can echo values
          # from .env.local, and GitHub only redacts registered secrets —
          # runner-local env values would land in the public job log.
          { grep -q 'Ready in' golden-dev.log && curl -sf "http://localhost:$GOLDEN_PORT/api/health" >/dev/null; } || { echo "dev server failed to boot — see golden-dev.log in the runner workdir (not printed: may contain env values)"; exit 1; }
          # The answer must come from OUR server, not whatever took the port.
          kill -0 "$DEVPID" 2>/dev/null || { echo "dev server exited after boot; refusing to test whatever answers on port $GOLDEN_PORT"; exit 1; }
          rc=0
          if [ "$HOSTED" = true ]; then
            BASE_URL="http://localhost:$GOLDEN_PORT" bun run test:e2e:golden || rc=$?
          else
            # Only this command sees the slot's login, in its own subshell.
            ( export GOLDEN_SLOT_NUMBER GOLDEN_COMPANY_ID GOLDEN_USER_EMAIL GOLDEN_USER_PASSWORD; BASE_URL="http://localhost:$GOLDEN_PORT" bun run test:e2e:golden ) || rc=$?
          fi
          if [ "$rc" -ne 0 ] && [ "$HOSTED" = true ]; then
            echo "::group::golden-dev.log (tail)"; tail -n 80 golden-dev.log; echo "::endgroup::"
          fi
          exit "$rc"
