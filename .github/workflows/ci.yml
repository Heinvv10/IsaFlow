name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel stale runs when a new commit is pushed to the same PR ref.
# This prevents a backlog of queued runs from burning Actions minutes.
# Master pushes never cancel: each one runs the full Golden Paths suite after
# the merge (golden-paths), which takes longer than the gap between merges, so
# cancelling would mean it never finished. A newer master push waits instead,
# and GitHub drops an older PENDING one, so the suite runs on the latest master.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Tighten token to read-only. CI only needs to check out code.
permissions:
  contents: read

jobs:
  quality:
    name: Type Check, Lint & Test
    runs-on: [self-hosted, linux, velo]
    # run-ci.sh ends with a production build, which the old five steps did not.
    # Measured 8m13s at load ~45 (R-052/green.log). OBSERVED on this box
    # 2026-10-12 (not bounds): every step but integration 15 min at load ~65,
    # 58 min at load 150-250; integration 8-16 min, 24 min at its worst.
    # 2026-10-21: the job took 20-24 min, integration 12-15 of it (one shard
    # holding the audit-snapshots suites); plan.ts now deals shards by measured
    # suite times (suite-seconds.json), ~8 min estimated. A Markdown-only change
    # skips integration, and a push that is an already-tested merge-queue merge
    # skips every gate (see the gate step below).
    # Since 2026-10-21 three runners share this box's 32 cores, so up to three
    # quality jobs (6 integration shards each) can overlap. Total CPU work is
    # the same as running them in turn, and the 58-min figure was measured at
    # load 150-250, so the bound stands. Fewer shards would lower the peak but
    # lengthen every run's critical path; queue merges no longer re-run on
    # master, which removes roughly one full job per merge.
    # Integration's own bounds: 4 schema-build commands at 300 s + 30 s kill
    # grace (CI_INT_MIGRATE_TIMEOUT), shards cut at 30 min (CI_INT_SHARD_TIMEOUT).
    # Not bounded by those: postgres start retries (up to 5 x 120 s per
    # cluster), the 10 s TERM-to-KILL graces at shard exit and in cleanup,
    # initdb and plan. 58 + 22 + 30 + ~2 install = ~112 min, so 120.
    timeout-minutes: 120
    # Read-only. actions + pull-requests: mq-merge-already-tested.ts reads the
    # merged PR and its CI run's jobs (CI_READ_TOKEN below).
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      # Full history: the integration scope diffs the tested tree against the
      # event's base, and the merge check needs both parents' ancestry. Shallow,
      # either would fail safe and run everything. persist-credentials: false
      # keeps this job's wider read token out of .git/config, where any test
      # could read it; nothing here fetches or pushes after checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # --ignore-scripts: bun install otherwise runs lifecycle scripts of the
      # root, workspace members and trusted dependencies, any of which could
      # rewrite scripts/ci/run-ci.sh before the gate runs (R-052).
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The gate list lives in ONE place: scripts/ci/run-ci.sh. This job used
      # to hand-list five of its steps, so every gate added to run-ci.sh after
      # that (security-guards, is-active-filters, vat-guard-coverage,
      # migration-rls, migration-naming, build, ...) ran only locally and a PR
      # could merge green while failing them (R-052). run-ci.sh reports every
      # failing gate and exits non-zero if any failed.
      #
      # The integration suites run here too: run-ci.sh's `integration` step
      # starts its own throwaway PostgreSQL 16 clusters as the runner user
      # (scripts/ci/integration/run.sh) and ignores DATABASE_URL, which stays
      # empty. It prints every suite that skipped and why
      # (scripts/ci/report-skipped-integration.ts). On a change that touches
      # only Markdown it skips them (scripts/ci/integration/scope.ts), and it
      # prints why it ran or skipped.
      #
      # On a push to master, run-ci.sh first asks
      # scripts/ci/mq-merge-already-tested.ts whether the pushed commit is a
      # merge-queue merge whose exact tree already passed both required checks
      # as a pull_request run; if so it exits 0 without running the gates. Any
      # doubt or error runs every gate.
      - name: CI gate (scripts/ci/run-ci.sh)
        run: bun run ci
        env:
          CI_READ_TOKEN: ${{ github.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: test-secret-for-ci-only
          NODE_ENV: test

  # Which golden-paths concurrency group this run takes (see golden-paths).
  # "queue" for a run the merge queue is waiting on: a batch PR
  # (merge-queue/* head) or a PR labelled in-merge-queue. In single mode the
  # queue updates the branch server-side and labels the PR a few seconds
  # later, so the label is not in the event payload; read it from the API,
  # and when the head was committed by GitHub (web-flow, as update-branch is)
  # give the label up to a minute to arrive. Any error means "pr", the old
  # behaviour. Not a required check.
  golden-lane:
    name: Golden Paths lane
    runs-on: [self-hosted, linux, velo]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - name: Decide the lane
        id: lane
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          lane="pr"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            case "$HEAD_REF" in merge-queue/*) lane="queue" ;; esac
            if [ "$lane" = "pr" ]; then
              tries=1
              committer=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.committer.login // ""') || committer=""
              [ "$committer" = "web-flow" ] && tries=12
              for i in $(seq 1 "$tries"); do
                if gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name' | grep -qx in-merge-queue; then lane="queue"; break; fi
                if [ "$i" -lt "$tries" ]; then sleep 5; fi
              done
            fi
          fi
          echo "lane=$lane" | tee -a "$GITHUB_OUTPUT"

  # Golden Paths smoke: the required browser check on every PR and every head
  # the merge queue tests (single mode updates the PR, batch mode opens a
  # merge-queue/* PR; both arrive here as pull_request). Login (global setup)
  # plus four money paths: invoice -> receipt (b), bank import (f), journal
  # post/reverse (g), payroll run -> GL (h); the list is test:e2e:golden:smoke
  # in package.json. The full suite runs after the merge (golden-paths).
  # Boots a dev server against isaflow_dev using the runner-local env file.
  golden-paths-smoke:
    name: Golden Paths smoke (blocking)
    runs-on: [self-hosted, linux, velo]
    # The four specs took 9-22 s together in the full runs of 2026-10-30, after
    # 20-60 s of boot; ~2-5 min with install. 20 leaves room for load spikes.
    timeout-minutes: 20
    # The suite writes to the SHARED isaflow_dev Demo company; the workflow's
    # ci-${{ github.ref }} group only serialises same-ref runs, so two branches
    # could otherwise interleave money flows (e.g. both claiming the same
    # payroll sandbox period). Serialise across ALL refs, never cancel. With
    # three runners (2026-10-21) runs of different refs do overlap, so this
    # group is what keeps them apart. GitHub keeps one PENDING job per group
    # and cancels the older pending one, so every ordinary PR push used to
    # cancel the merge queue's pending run, and the queue ejected the PR after
    # two re-runs (#938, 2026-10-29). Runs the queue waits on (golden-lane)
    # therefore take their own -queue group, which PR pushes cannot cancel.
    # The cost: one queue run can overlap one PR run, and the post-merge full
    # run, on the Demo company until per-runner slots land (#916).
    # !cancelled(): a failed golden-lane still runs the suite, in the ordinary
    # group.
    needs: golden-lane
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    concurrency:
      group: golden-paths-dev-demo${{ needs.golden-lane.outputs.lane == 'queue' && '-queue' || '' }}
      cancel-in-progress: false

    steps:
      # No token left in .git/config (the install below runs dependency
      # lifecycle scripts).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Boot dev server and run the golden paths smoke
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          set -e
          # A missing env file must FAIL, not skip: a blocking gate that
          # silently no-ops is exactly the "quiet 45/100" this job prevents.
          if [ ! -f /home/hein/isaflow-ci.env ]; then
            echo "::error::/home/hein/isaflow-ci.env missing on runner — golden paths cannot run (blocking gate, refusing to pass silently)"
            exit 1
          fi
          cp /home/hein/isaflow-ci.env .env.local
          bunx playwright install chromium
          # Ephemeral port: avoids collisions with stale servers from earlier
          # cancelled runs on this long-lived runner (a stale next dev on a
          # fixed port would pass the health check and test OLD code).
          # Next.js refuses fetch-spec "bad ports"; 3659 (apple-sasl) is the
          # only one in this range and failed a boot on 2026-10-28.
          GOLDEN_PORT=$((3300 + RANDOM % 500))
          [ "$GOLDEN_PORT" -eq 3659 ] && GOLDEN_PORT=3660
          bunx next dev -p "$GOLDEN_PORT" > golden-dev.log 2>&1 &
          DEVPID=$!
          trap 'kill $DEVPID 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            curl -sf "http://localhost:$GOLDEN_PORT/api/health" >/dev/null && break
            sleep 2
          done
          # Do NOT cat/tail golden-dev.log here: the boot log can echo values
          # from .env.local, and GitHub only redacts registered secrets —
          # runner-local env values would land in the public job log.
          curl -sf "http://localhost:$GOLDEN_PORT/api/health" >/dev/null || { echo "dev server failed to boot — see golden-dev.log in the runner workdir (not printed: may contain env values)"; exit 1; }
          BASE_URL="http://localhost:$GOLDEN_PORT" bun run test:e2e:golden:smoke

  # TEMPORARY (remove after the branch-protection switch): branch protection
  # and the merge queue (requiredChecks in ~/.config/merge-queue/isaflow.json)
  # still require "Golden Paths E2E (blocking)" on every PR head. This job
  # carries that name and passes only when the smoke job passed, so PRs keep
  # merging until master's required checks become "Type Check, Lint & Test" +
  # "Golden Paths smoke (blocking)". always(): a required check that is itself
  # skipped counts as passing, so a skipped or cancelled smoke must fail here.
  golden-paths-shim:
    name: Golden Paths E2E (blocking)
    needs: golden-paths-smoke
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: [self-hosted, linux, velo]
    timeout-minutes: 5
    steps:
      - name: Did Golden Paths smoke pass?
        env:
          SMOKE: ${{ needs.golden-paths-smoke.result }}
        run: |
          echo "Golden Paths smoke: $SMOKE (temporary shim for the old required check name)"
          [ "$SMOKE" = "success" ]

  # Golden-paths money-flow E2E (A-Z programme), the FULL suite, after the
  # merge: every push to master. It no longer runs on, or blocks, PRs or the
  # merge queue (the smoke job above does); a red run opens or updates a
  # golden-paths-red issue (golden-paths-report) and reverts nothing. Its name
  # must never be a required check's. Boots a dev server against isaflow_dev
  # using the runner-local env file and runs tests/e2e/golden-paths/ over HTTP.
  golden-paths:
    name: Golden Paths E2E (post-merge)
    runs-on: [self-hosted, linux, velo]
    # Green runs took 19-30 min on 2026-10-29 (one 29m40s), and at load 60-85
    # two runs of #949 hit a 30-min cap mid-suite, ending cancelled, not red.
    timeout-minutes: 45
    # Its own group, never cancelled: sharing the PR or -queue smoke group
    # would hold PR and queue runs behind a 30-45 min suite, and a pending PR
    # run would cancel it (one PENDING job per group). Master pushes already
    # queue at the workflow level (top of file); this also keeps a re-run of
    # an older master run off a newer one. It overlaps smoke runs on the Demo
    # company until per-runner slots land (#916).
    if: ${{ github.event_name == 'push' }}
    concurrency:
      group: golden-paths-post-merge
      cancel-in-progress: false

    steps:
      # No token left in .git/config (the install below runs dependency
      # lifecycle scripts).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Boot dev server and run golden paths
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          set -e
          # A missing env file must FAIL, not skip: a blocking gate that
          # silently no-ops is exactly the "quiet 45/100" this job prevents.
          if [ ! -f /home/hein/isaflow-ci.env ]; then
            echo "::error::/home/hein/isaflow-ci.env missing on runner — golden paths cannot run (blocking gate, refusing to pass silently)"
            exit 1
          fi
          cp /home/hein/isaflow-ci.env .env.local
          bunx playwright install chromium
          # Ephemeral port: avoids collisions with stale servers from earlier
          # cancelled runs on this long-lived runner (a stale next dev on a
          # fixed port would pass the health check and test OLD code).
          # Next.js refuses fetch-spec "bad ports"; 3659 (apple-sasl) is the
          # only one in this range and failed a boot on 2026-10-28.
          GOLDEN_PORT=$((3300 + RANDOM % 500))
          [ "$GOLDEN_PORT" -eq 3659 ] && GOLDEN_PORT=3660
          bunx next dev -p "$GOLDEN_PORT" > golden-dev.log 2>&1 &
          DEVPID=$!
          trap 'kill $DEVPID 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            curl -sf "http://localhost:$GOLDEN_PORT/api/health" >/dev/null && break
            sleep 2
          done
          # Do NOT cat/tail golden-dev.log here: the boot log can echo values
          # from .env.local, and GitHub only redacts registered secrets —
          # runner-local env values would land in the public job log.
          curl -sf "http://localhost:$GOLDEN_PORT/api/health" >/dev/null || { echo "dev server failed to boot — see golden-dev.log in the runner workdir (not printed: may contain env values)"; exit 1; }
          BASE_URL="http://localhost:$GOLDEN_PORT" bun run test:e2e:golden

  # Flags the post-merge run loudly. A red (or started, then cancelled or timed
  # out) golden-paths opens a golden-paths-red issue, or comments on the open
  # one, with the run link and the commit; the next green run closes it. It
  # never reverts anything. The only job with a write scope (issues): it has no
  # checkout and runs no repo code, so nothing the suite installs or runs can
  # reach that token.
  golden-paths-report:
    name: Golden Paths post-merge report
    needs: golden-paths
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: [self-hosted, linux, velo]
    timeout-minutes: 5
    # actions: read for the jobs API below (did a cancelled run start?).
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open, update or close the golden-paths-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.golden-paths.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          label=golden-paths-red
          verdict="$RESULT"
          if [ "$RESULT" = "cancelled" ]; then
            # Superseded while pending (no steps) is not a signal; a run that
            # started and was then cancelled or hit its timeout is.
            steps=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "Golden Paths E2E (post-merge)")] | .[0].steps | length')
            case "$steps" in ''|*[!0-9]*) echo "::error::could not read the post-merge job's steps (got '$steps')"; exit 1 ;; esac
            if [ "$steps" -gt 0 ]; then verdict="did not finish (cancelled or timed out)"; else verdict="superseded"; fi
          fi
          echo "golden-paths: $RESULT -> $verdict"
          open=$(gh issue list -R "$REPO" --label "$label" --state open --json number --jq '.[].number')
          case "$verdict" in
            success)
              for n in $open; do
                gh issue close "$n" -R "$REPO" --comment "Green again: Golden Paths E2E (post-merge) passed at $COMMIT_URL ($RUN_URL)."
              done
              ;;
            superseded|skipped)
              echo "nothing to report"
              ;;
            *)
              body=$(printf 'Golden Paths E2E (post-merge) on master: **%s**\n\n- Run: %s\n- Commit: %s\n- Subject: %s\n\nNothing was reverted. Read the run log, then fix forward or revert by PR.\n' \
                "$verdict" "$RUN_URL" "$COMMIT_URL" "${SUBJECT%%$'\n'*}")
              gh label create "$label" -R "$REPO" --color B60205 \
                --description "Golden Paths E2E (post-merge) is red on master" --force
              first=${open%%$'\n'*}
              if [ -n "$first" ]; then
                gh issue comment "$first" -R "$REPO" --body "$body"
              else
                gh issue create -R "$REPO" --label "$label" --title "Golden Paths red on master (post-merge)" --body "$body"
              fi
              echo "::error::Golden Paths E2E (post-merge) $verdict at $COMMIT_URL; golden-paths-red issue updated"
              exit 1
              ;;
          esac
