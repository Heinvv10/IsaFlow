name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel stale runs when a new commit is pushed to the same ref.
# This prevents a backlog of queued runs from burning Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Tighten token to read-only. CI only needs to check out code.
permissions:
  contents: read

jobs:
  quality:
    name: Type Check, Lint & Test
    runs-on: [self-hosted, linux, velo]
    # run-ci.sh ends with a production build, which the old five steps did not.
    # Measured 8m13s at load ~45 (R-052/green.log). OBSERVED on this box
    # 2026-10-12 (not bounds): every step but integration 15 min at load ~65,
    # 58 min at load 150-250; integration 8-16 min, 24 min at its worst.
    # 2026-10-21: the job took 20-24 min, integration 12-15 of it (one shard
    # holding the audit-snapshots suites); plan.ts now deals shards by measured
    # suite times (suite-seconds.json), ~8 min estimated. A Markdown-only change
    # skips integration, and a push that is an already-tested merge-queue merge
    # skips every gate (see the gate step below).
    # Since 2026-10-21 three runners share this box's 32 cores, so up to three
    # quality jobs (6 integration shards each) can overlap. Total CPU work is
    # the same as running them in turn, and the 58-min figure was measured at
    # load 150-250, so the bound stands. Fewer shards would lower the peak but
    # lengthen every run's critical path; queue merges no longer re-run on
    # master, which removes roughly one full job per merge.
    # Integration's own bounds: 4 schema-build commands at 300 s + 30 s kill
    # grace (CI_INT_MIGRATE_TIMEOUT), shards cut at 30 min (CI_INT_SHARD_TIMEOUT).
    # Not bounded by those: postgres start retries (up to 5 x 120 s per
    # cluster), the 10 s TERM-to-KILL graces at shard exit and in cleanup,
    # initdb and plan. 58 + 22 + 30 + ~2 install = ~112 min, so 120.
    timeout-minutes: 120
    # Read-only. actions + pull-requests: mq-merge-already-tested.ts reads the
    # merged PR and its CI run's jobs (CI_READ_TOKEN below).
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      # Full history: the integration scope diffs the tested tree against the
      # event's base, and the merge check needs both parents' ancestry. Shallow,
      # either would fail safe and run everything. persist-credentials: false
      # keeps this job's wider read token out of .git/config, where any test
      # could read it; nothing here fetches or pushes after checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # --ignore-scripts: bun install otherwise runs lifecycle scripts of the
      # root, workspace members and trusted dependencies, any of which could
      # rewrite scripts/ci/run-ci.sh before the gate runs (R-052).
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The gate list lives in ONE place: scripts/ci/run-ci.sh. This job used
      # to hand-list five of its steps, so every gate added to run-ci.sh after
      # that (security-guards, is-active-filters, vat-guard-coverage,
      # migration-rls, migration-naming, build, ...) ran only locally and a PR
      # could merge green while failing them (R-052). run-ci.sh reports every
      # failing gate and exits non-zero if any failed.
      #
      # The integration suites run here too: run-ci.sh's `integration` step
      # starts its own throwaway PostgreSQL 16 clusters as the runner user
      # (scripts/ci/integration/run.sh) and ignores DATABASE_URL, which stays
      # empty. It prints every suite that skipped and why
      # (scripts/ci/report-skipped-integration.ts). On a change that touches
      # only Markdown it skips them (scripts/ci/integration/scope.ts), and it
      # prints why it ran or skipped.
      #
      # On a push to master, run-ci.sh first asks
      # scripts/ci/mq-merge-already-tested.ts whether the pushed commit is a
      # merge-queue merge whose exact tree already passed both required checks
      # as a pull_request run; if so it exits 0 without running the gates. Any
      # doubt or error runs every gate.
      - name: CI gate (scripts/ci/run-ci.sh)
        run: bun run ci
        env:
          CI_READ_TOKEN: ${{ github.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: test-secret-for-ci-only
          NODE_ENV: test

  # Golden-paths money-flow E2E (A–Z programme). BLOCKING since Phase 3
  # (P3.1): a red money path fails the whole run — no continue-on-error, no
  # silent skip. Boots a dev server against isaflow_dev using the runner-local
  # env file and runs tests/e2e/golden-paths/ over HTTP.
  golden-paths:
    name: Golden Paths E2E (blocking)
    runs-on: [self-hosted, linux, velo]
    timeout-minutes: 30
    # Each runner owns one Golden Paths slot: a company of its own on isaflow_dev
    # with its own golden user (the step below maps $RUNNER_NAME to GOLDEN_SLOT_n
    # in /home/hein/isaflow-ci.env; scripts/ci/golden/provision-slots.ts creates
    # them). A runner runs one job at a time, so a slot is exclusive without any
    # lock, and runs of different refs overlap on different runners. Before the
    # slots every run wrote to the ONE Demo company (payroll sandbox month,
    # find-or-create fixtures, per-month depreciation, a FIFO over the oldest
    # documents), which is why this was a single group for all refs.
    # The group is per ref and never cancels. It is NOT what keeps slots apart
    # (runner exclusivity does that): it only stops two golden runs of one ref
    # from running at once. GitHub keeps one running and one PENDING job per
    # group and cancels an older pending one, which the merge queue re-runs up
    # to twice per head. A master push that skips (the step below) still enters
    # its ref's group, but holds it for seconds. It cannot take a per-sha group
    # instead: the group is fixed before the step decides, and a push that falls
    # back to the full suite must not overlap the PR runs of that ref.
    concurrency:
      group: golden-paths-${{ github.ref }}
      cancel-in-progress: false
    # Read-only; for the merge check below (as in quality).
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      # As in quality: full history, no token left in .git/config (the install
      # below runs dependency lifecycle scripts).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # A push to master that is an already-tested merge-queue merge skips the
      # suite (see quality's gate step); the job still reports success. Exit
      # 10 skips; any other exit, a crash included, runs the suite.
      - name: Already tested as a pull_request run?
        id: mq
        env:
          CI_READ_TOKEN: ${{ github.token }}
        run: |
          rc=0
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            bun scripts/ci/mq-merge-already-tested.ts || rc=$?
          fi
          if [ "$rc" -eq 10 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install dependencies
        if: steps.mq.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Boot dev server and run golden paths
        if: steps.mq.outputs.skip != 'true'
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          set -e
          # A missing env file must FAIL, not skip: a blocking gate that
          # silently no-ops is exactly the "quiet 45/100" this job prevents.
          if [ ! -f /home/hein/isaflow-ci.env ]; then
            echo "::error::/home/hein/isaflow-ci.env missing on runner — golden paths cannot run (blocking gate, refusing to pass silently)"
            exit 1
          fi
          # One golden slot per runner. An unknown runner must FAIL: falling
          # back to the shared Demo company would let two runs interleave
          # money flows there again.
          case "$RUNNER_NAME" in
            velo-server-u) slot=1 ;;
            velo-isaflow-u2) slot=2 ;;
            velo-isaflow-u3) slot=3 ;;
            *)
              echo "::error::runner '$RUNNER_NAME' has no golden slot; add it to the case in the golden-paths job and provision a slot (scripts/ci/golden/provision-slots.ts)"
              exit 1
              ;;
          esac
          # Read the slot's keys with grep, not `source`: the file has values
          # that are not valid shell (SMTP_FROM).
          slot_value() { grep -m1 "^GOLDEN_SLOT_${slot}_$1=" /home/hein/isaflow-ci.env | cut -d= -f2-; }
          GOLDEN_COMPANY_ID=$(slot_value COMPANY_ID)
          GOLDEN_USER_EMAIL=$(slot_value EMAIL)
          GOLDEN_USER_PASSWORD=$(slot_value PASSWORD)
          if [ -z "$GOLDEN_COMPANY_ID" ] || [ -z "$GOLDEN_USER_EMAIL" ] || [ -z "$GOLDEN_USER_PASSWORD" ]; then
            echo "::error::GOLDEN_SLOT_${slot}_{COMPANY_ID,EMAIL,PASSWORD} missing from /home/hein/isaflow-ci.env; run scripts/ci/golden/provision-slots.ts"
            exit 1
          fi
          # GitHub redacts only registered secrets; this one is runner-local.
          echo "::add-mask::$GOLDEN_USER_PASSWORD"
          echo "GOLDEN SLOT $slot (company $GOLDEN_COMPANY_ID, user $GOLDEN_USER_EMAIL) on runner $RUNNER_NAME"
          # The app and the dev server get the shared env file WITHOUT the slots'
          # keys: only the Playwright command below sees one slot's password.
          grep -v '^GOLDEN_SLOT_' /home/hein/isaflow-ci.env > .env.local
          bunx playwright install chromium
          # Ephemeral port, never one that is already bound: a stale or foreign
          # server (docker-proxy answers on 3400/3420/3430) would pass the health
          # check and the suite would test OLD code or someone else's service.
          # The specs that check the host allow 3300-3799; each slot draws from a
          # window of its own inside it (166 ports), so two runners never pick the
          # same port. Disjoint windows rule out a check-then-bind race, which a
          # wider shared window would leave open. Next.js refuses fetch-spec "bad
          # ports"; 3659 (apple-sasl) is the only one in 3300-3799 and failed a
          # boot on 2026-10-28, so it is never drawn (it sits in slot 3's window).
          slot_lo=$((3300 + (slot - 1) * 166))
          slot_hi=$((slot_lo + 165))
          # A dev server an earlier timed-out job of this runner left in the window would keep writing to the slot.
          # Stops only listeners whose cwd is in this runner's workspace, by exact pid (never a pattern); see the script.
          bun scripts/ci/golden/killSlotOrphans.ts "$slot_lo" "$slot_hi" || true
          GOLDEN_PORT=""
          for _ in $(seq 1 50); do
            candidate=$((slot_lo + RANDOM % 166))
            [ "$candidate" -eq 3659 ] && continue
            if ! ss -ltn | awk '{print $4}' | grep -qE ":${candidate}\$"; then GOLDEN_PORT=$candidate; break; fi
          done
          if [ -z "$GOLDEN_PORT" ]; then echo "::error::no free port in the window of slot $slot"; exit 1; fi
          bunx next dev -p "$GOLDEN_PORT" > golden-dev.log 2>&1 &
          DEVPID=$!
          trap 'kill $DEVPID 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            curl -sf "http://localhost:$GOLDEN_PORT/api/health" >/dev/null && break
            sleep 2
          done
          # Do NOT cat/tail golden-dev.log here: the boot log can echo values
          # from .env.local, and GitHub only redacts registered secrets —
          # runner-local env values would land in the public job log.
          curl -sf "http://localhost:$GOLDEN_PORT/api/health" >/dev/null || { echo "dev server failed to boot — see golden-dev.log in the runner workdir (not printed: may contain env values)"; exit 1; }
          # The health answer must come from OUR server: if it died (port taken
          # after the check), whatever answers is not what this job is testing.
          kill -0 "$DEVPID" 2>/dev/null || { echo "dev server exited after boot; refusing to test whatever answers on port $GOLDEN_PORT"; exit 1; }
          # Only this command sees the slot's login, in its own subshell.
          ( export GOLDEN_COMPANY_ID GOLDEN_USER_EMAIL GOLDEN_USER_PASSWORD; BASE_URL="http://localhost:$GOLDEN_PORT" bun run test:e2e:golden )
