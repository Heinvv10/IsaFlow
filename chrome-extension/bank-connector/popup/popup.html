<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ISAFlow Bank Connector</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 12px; width: 320px; color: #1f2937; }
      h1 { font-size: 14px; margin: 0 0 12px; color: #2563eb; }
      .conn { padding: 8px; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 8px; font-size: 12px; }
      .conn-bank { font-weight: 600; }
      .conn-meta { color: #6b7280; font-size: 11px; }
      .row { display: flex; gap: 6px; margin-top: 6px; }
      button { padding: 4px 10px; font-size: 12px; border: 1px solid #2563eb; background: #2563eb; color: white; border-radius: 4px; cursor: pointer; }
      button.secondary { background: white; color: #2563eb; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .empty { color: #6b7280; font-size: 12px; text-align: center; padding: 24px 8px; }
      .empty a { color: #2563eb; text-decoration: none; }
      #status { font-size: 11px; color: #6b7280; margin-top: 8px; min-height: 14px; }
      #status.ok { color: #16a34a; }
      #status.err { color: #dc2626; }
    </style>
  </head>
  <body>
    <h1>ISAFlow Bank Connector</h1>
    <div id="connections"></div>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
